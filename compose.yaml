name: tablepilot

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8020:8000"
    networks:
      - default
      - glidery-db
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5174:5174"
    restart: unless-stopped

volumes:
  backend_vendor:
  frontend_node_modules:

networks:
  glidery-db:
    external: true